<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BYU-Idaho CSE</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #1a2233;
        --muted: #4a5568;
        --primary: #0057b8;
        --primary-hover: #00479a;
        --ring: rgba(0, 87, 184, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg));
        color: var(--text);
        padding: 1.5rem;
      }

      main {
        width: min(560px, 100%);
        background: var(--card);
        border: 1px solid #e8edf5;
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(12, 38, 76, 0.08);
        padding: 2.5rem 2rem;
        text-align: center;
      }

      .label {
        margin: 0;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--muted);
      }

      h1 {
        margin: 0.75rem 0 1rem;
        font-size: clamp(1.6rem, 4vw, 2.2rem);
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .link {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 0.75rem 1.2rem;
        border-radius: 10px;
        text-decoration: none;
        color: #ffffff;
        background: var(--primary);
        font-weight: 600;
        transition: background-color 0.2s ease, transform 0.2s ease;
      }

      .link:hover,
      .link:focus-visible {
        background: var(--primary-hover);
        transform: translateY(-1px);
      }

      .link:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="label">BYU-Idaho</p>
      <h1>Computer Science &amp; Engineering Department</h1>
      <p>Explore programs, resources, and opportunities in computing and engineering.</p>
      <a class="link" href="https://www.byui.edu/computer-science-engineering/">Visit Department Page</a>
    </main>
  </body>
</html>
